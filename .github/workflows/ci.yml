name: CI

# Validation gate. Cloudflare Pages (Git integration) owns build + deploy on
# every push to main and creates preview deployments for PRs — so this workflow
# does NOT deploy. It runs the typecheck, build and Playwright render/UI tests
# so a red check warns you before a broken bundle ships to Cloudflare.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
